name: Offline checks (no model API calls)
on:
  push:
    paths: ['src/**', 'tests/**', 'assets/**', 'docs/**', 'paper/**', 'data/**', '*.md', '*.html', 'requirements.txt', '.github/workflows/offline-tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'assets/**', 'docs/**', 'paper/**', 'data/**', '*.md', '*.html', 'requirements.txt']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: python src/check_secrets.py
      - run: python src/check_anonymity.py
      - run: python src/check_navigation.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_demo_logic.cjs
