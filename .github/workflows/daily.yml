name: Manual benchmark rebuild

on:
  # Intentionally manual-only: API-backed rebuilds run only after the owner
  # explicitly dispatches this workflow.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: manual-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Rebuild benchmark
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          LSVQA_CERT_SAMPLES: "4"
          LSVQA_ENGLISH_RATIO: "0.85"
          LSVQA_QUANT_RATIO: "0.65"
        run: python -u src/daily.py

      - name: Commit and push
        run: |
          git config user.name "livesearchvqa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily build $(date -u +%F)"
          git push
