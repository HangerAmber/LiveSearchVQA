name: Daily benchmark rebuild

on:
  schedule:
    - cron: "30 0 * * *"   # 08:30 Beijing time, daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Rebuild benchmark
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: python -u src/daily.py

      - name: Commit and push
        run: |
          git config user.name "livesearchvqa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily build $(date -u +%F)"
          git push
